<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>한영지킴이 (HanImeGuard) 앱 아이콘</title>
  <desc>방패 안에 포토샵 블루 한과 일러스트레이터 오렌지 A가 대각선으로 분할 배치된 IME 전환 아이콘</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001E36"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bgGrad)"/>

  <rect x="3" y="3" width="1018" height="1018" rx="217"
        fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>

  <path d="M 200 130 L 824 130 Q 884 130 884 190 L 884 590 Q 884 800 692 882 Q 512 916 332 882 Q 140 800 140 590 L 140 190 Q 140 130 200 130 Z"
        fill="rgba(255,255,255,0.04)"
        stroke="rgba(255,255,255,0.85)"
        stroke-width="14"
        stroke-linejoin="round"/>

  <text x="380" y="460"
        font-family="'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif"
        font-size="280" font-weight="700"
        fill="#31A8FF" text-anchor="middle">한</text>

  <line x1="740" y1="280" x2="280" y2="780"
        stroke="rgba(255,255,255,0.5)" stroke-width="14" stroke-linecap="round"/>

  <text x="650" y="810"
        font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="360" font-weight="900"
        fill="#FF9A00" text-anchor="middle">A</text>
</svg>
